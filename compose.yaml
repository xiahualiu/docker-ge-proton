services:
  enshrouded-server-test:
    build:
      context: .
      args:
        STEAM_USER: "steam"
        STEAM_HOME: "/home/steam"
        STEAM_USER_UID: "1000"
        STEAM_USER_GID: "1000"
        STEAMCMD_DIR: "/home/steam/steamcmd"
        STEAM_APP_DIR: "/home/steam/server"
        PROTON_VERSION: "GE-Proton10-26"

    image: enshrouded-server-test:latest
    container_name: enshrouded-server-test
    user: "1000:1000"
    ports:
      - "15637:15637/udp" # Query port
      - "27015:27015/udp" # Steam port
    environment:
      - STEAM_APP_ID=2278520
      - GAME_EXECUTABLE=enshrouded_server.exe
    volumes:
      - ./game_data:/home/steam/server
